name: server

on:
  push:
    branches: [master]
    paths-ignore: ["docs/adr/**", "docs/agents/**", "docs/roadmap.md", "README.md", "GLOSSARY.md", "CLAUDE.md",
                   ".github/workflows/release.yml"]
  # "edited": a description edited after a failed changelog step runs the workflow again (all jobs, so that no skipped
  # job stands in for an earlier failure of the same commit).
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths-ignore: ["docs/adr/**", "docs/agents/**", "docs/roadmap.md", "README.md", "GLOSSARY.md", "CLAUDE.md",
                   ".github/workflows/release.yml"]

permissions:
  contents: read

jobs:
  # Pull requests only: a line added to CHANGELOG.md, or "Changelog: none" in the description (AGENTS.md,
  # "Changelog checklist"). The description reaches the script only through the environment.
  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # The checkout is the PR merged into its base; its first parent is the base.
      - name: 'Changelog line or "Changelog: none"'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash .github/scripts/changelog-check-test.sh
          bash .github/scripts/changelog-check.sh HEAD^1 HEAD

  check:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Data set for the tests (Git LFS, 9Data only)
        run: git lfs ls-files -l -I "original-data/9Data/**" | cut -d' ' -f1 | sort > .lfs-9data-ids

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-9data-${{ hashFiles('.lfs-9data-ids') }}

      - run: git lfs pull -I "original-data/9Data/**"

      - uses: jdx/mise-action@v5

      - name: Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: plts
          key: plt-${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}-deps-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - run: mix check

      - run: mix deps.audit

  # Windows: single-node mode with SQLite (docs/technical/testing.md, "Windows").
  check-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Data set for the tests (Git LFS, 9Data only)
        run: git lfs ls-files -l -I "original-data/9Data/**" | cut -d' ' -f1 | sort > .lfs-9data-ids

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-9data-${{ hashFiles('.lfs-9data-ids') }}

      - run: git lfs pull -I "original-data/9Data/**"

      - uses: jdx/mise-action@v5

      - name: Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: plts
          key: plt-${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}-deps-${{ hashFiles('mix.lock') }}

      - run: mix deps.get

      - run: mix check

      - run: mix deps.audit

  # The release on Windows: import from a backslash path, start, account, login up to the character list, stop.
  windows-smoke:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Data set (Git LFS, 9Data only)
        shell: bash
        run: git lfs ls-files -l -I "original-data/9Data/**" | cut -d' ' -f1 | sort > .lfs-9data-ids

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-9data-${{ hashFiles('.lfs-9data-ids') }}

      - run: git lfs pull -I "original-data/9Data/**"

      - uses: jdx/mise-action@v5

      - run: mix deps.get

      - name: Release
        env:
          MIX_ENV: prod
        run: mix release

      - name: Import from a backslash path
        run: _build\prod\rel\pinata\bin\pinata eval "GameData.Release.import_data(~S($env:GITHUB_WORKSPACE\original-data\9Data), ~s(data))"

      # Without -NoNewWindow and redirections Start-Process does not pass this step's handles on, so the step ends
      # while the node runs on; cmd writes the node's output to a file.
      - name: Start
        run: |
          Start-Process -FilePath cmd.exe -WindowStyle Hidden `
            -ArgumentList "/c", "_build\prod\rel\pinata\bin\pinata.bat start > `"$env:RUNNER_TEMP\pinata.out`" 2>&1"
          $deadline = (Get-Date).AddSeconds(120)
          while ($true) {
            try { [System.Net.Sockets.TcpClient]::new("127.0.0.1", 9010).Close(); break }
            catch { if ((Get-Date) -gt $deadline) { throw "Login does not listen on 9010" }; Start-Sleep -Seconds 2 }
          }

      - name: Account
        run: '"smoke-password" | _build\prod\rel\pinata\bin\pinata eval "Persistence.Release.create_account(~s(smoke))"'

      - run: mix run --no-start test/support/smoke.exs 9010

      - name: Stop
        run: _build\prod\rel\pinata\bin\pinata stop

      - name: Node output
        if: failure()
        run: Get-Content "$env:RUNNER_TEMP\pinata.out" -ErrorAction SilentlyContinue

  test-postgres:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pinata_test
      PINATA_TEST_TOPOLOGY: multi
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinata_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'true'
      - uses: jdx/mise-action@v5
      - run: mix deps.get
      - run: mix pinata.migrate
      - run: mix test --warnings-as-errors

  compose-smoke:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Data set (Git LFS, 9Data only)
        run: git lfs ls-files -l -I "original-data/9Data/**" | cut -d' ' -f1 | sort > .lfs-9data-ids

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-9data-${{ hashFiles('.lfs-9data-ids') }}

      - run: git lfs pull -I "original-data/9Data/**"

      - uses: jdx/mise-action@v5

      - run: mix deps.get

      - run: mix pinata.import_data original-data/9Data data

      # compose.yaml pulls the published image; build the current commit under exactly that name instead.
      - name: Image of this commit
        run: docker build -t "$(grep -o -m1 'ghcr.io/wbpascal/pinata:[^ ]*' compose.yaml)" .

      - run: docker compose up -d

      - run: printf 'smoke-password\n' | docker compose exec -T login /app/bin/pinata eval 'Persistence.Release.create_account("smoke")'

      - run: mix run --no-start test/support/smoke.exs 9010

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop
        if: always()
        run: docker compose down -v

  # The release with OpenTelemetry: export off opens nothing and logs nothing; export on reaches a real Collector.
  otel-smoke:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      R: _build/prod/rel/pinata
    steps:
      - uses: actions/checkout@v7

      - name: Data set (Git LFS, 9Data only)
        run: git lfs ls-files -l -I "original-data/9Data/**" | cut -d' ' -f1 | sort > .lfs-9data-ids

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-9data-${{ hashFiles('.lfs-9data-ids') }}

      - run: git lfs pull -I "original-data/9Data/**"

      - uses: jdx/mise-action@v5

      - run: mix deps.get

      - run: MIX_ENV=prod mix release

      - run: $R/bin/pinata eval "GameData.Release.import_data(~S($GITHUB_WORKSPACE/original-data/9Data), ~s(data))"

      - name: Export off
        run: |
          set -euo pipefail
          OTEL_TRACES_EXPORTER=otlp $R/bin/pinata start > "$RUNNER_TEMP/off.out" 2>&1 &
          for i in $(seq 60); do
            if (echo > /dev/tcp/127.0.0.1/9010) 2> /dev/null; then break; fi
            if [ "$i" = 60 ]; then echo "Login does not listen on 9010"; exit 1; fi
            sleep 2
          done
          $R/bin/pinata rpc "Code.eval_file(~S($PWD/test/support/otel_apps.exs))" | grep -F '[:opentelemetry, :opentelemetry_experimental, :opentelemetry_exporter]'
          $R/bin/pinata rpc "Pinata.Figures.print()" | grep -F "Packet handling time"
          $R/bin/pinata stop
          ! grep -E 'OTLP|opentelemetry|CA\(s\)' "$RUNNER_TEMP/off.out"

      - name: Collector
        run: docker run -d --name otelcol -p 4318:4318 -v "$PWD/test/support/otel-collector.yaml:/etc/otelcol/config.yaml:ro" otel/opentelemetry-collector:0.119.0

      - name: Export on
        run: |
          set -euo pipefail
          printf '[telemetry]\notlp_enabled = true\ntrace_ratio = 1.0\n' > otel.toml
          PINATA_CONFIG=otel.toml $R/bin/pinata start > "$RUNNER_TEMP/on.out" 2>&1 &
          for i in $(seq 60); do
            if (echo > /dev/tcp/127.0.0.1/9010) 2> /dev/null; then break; fi
            if [ "$i" = 60 ]; then echo "Login does not listen on 9010"; exit 1; fi
            sleep 2
          done
          $R/bin/pinata rpc "Code.eval_file(~S($PWD/test/support/otel_apps.exs))" | grep -F '[:opentelemetry, :opentelemetry_experimental, :opentelemetry_exporter]'
          printf 'smoke-password\n' | $R/bin/pinata eval 'Persistence.Release.create_account("smoke")'
          mix run --no-start test/support/smoke.exs 9010
          $R/bin/pinata rpc "Code.eval_file(~S($PWD/test/support/otel_enter.exs))"
          sleep 2
          $R/bin/pinata rpc ':otel_tracer_provider.force_flush()'
          $R/bin/pinata rpc ':otel_meter_server.force_flush()'
          grep -F "Pinata: OpenTelemetry export on" "$RUNNER_TEMP/on.out"
          $R/bin/pinata stop

      - name: Collector received
        run: |
          for i in $(seq 15); do
            docker logs otelcol > "$RUNNER_TEMP/otelcol.out" 2>&1
            if grep -qF pinata.packet.duration "$RUNNER_TEMP/otelcol.out" &&
              grep -qF pinata.tick.duration "$RUNNER_TEMP/otelcol.out" &&
              grep -qE 'Name +: pinata\.packet *$' "$RUNNER_TEMP/otelcol.out"; then exit 0; fi
            sleep 2
          done
          echo "the Collector did not receive the span pinata.packet and both metrics"
          exit 1

      - name: Node and Collector output
        if: failure()
        run: |
          cat "$RUNNER_TEMP/off.out" "$RUNNER_TEMP/on.out" || true
          docker logs otelcol || true

      - name: Stop the Collector
        if: always()
        run: docker rm -f otelcol || true

  # The load run task against the release in single-node mode, 50 players for 10 s (docs/technical/load-run.md,
  # "CI smoke run"). It fails on a player that does not reach the world, a disconnect, a crash or an error line of the
  # node, never on latency.
  load-smoke:
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
      R: _build/prod/rel/pinata
    steps:
      - uses: actions/checkout@v7

      - name: Data set (Git LFS, 9Data only)
        run: git lfs ls-files -l -I "original-data/9Data/**" | cut -d' ' -f1 | sort > .lfs-9data-ids

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-9data-${{ hashFiles('.lfs-9data-ids') }}

      - run: git lfs pull -I "original-data/9Data/**"

      - uses: jdx/mise-action@v5

      - run: mix deps.get

      - run: MIX_ENV=prod mix release

      - run: $R/bin/pinata eval "GameData.Release.import_data(~S($GITHUB_WORKSPACE/original-data/9Data), ~s(data))"

      - name: Start
        run: |
          set -euo pipefail
          $R/bin/pinata start > "$RUNNER_TEMP/node.out" 2>&1 &
          for i in $(seq 60); do
            if (echo > /dev/tcp/127.0.0.1/9010) 2> /dev/null; then break; fi
            if [ "$i" = 60 ]; then echo "Login does not listen on 9010"; exit 1; fi
            sleep 2
          done

      # Single-node mode creates the accounts load0001 to load0050 on their first login.
      - run: mix pinata.load --host 127.0.0.1 --port 9010 --scenario crowd --players 50 --hold 10 --stop-after-hold

      - run: $R/bin/pinata rpc "Pinata.Figures.print()"

      - name: Stop, no error line
        run: |
          $R/bin/pinata stop
          ! grep -F '[error]' "$RUNNER_TEMP/node.out"

      - name: Node output
        if: failure()
        run: cat "$RUNNER_TEMP/node.out" || true
