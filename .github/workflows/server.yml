name: server

on:
  push:
    branches: [master]
    paths: ["server/**", "mise.toml", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "mise.toml", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      
      - uses: jdx/mise-action@v5

      - name: Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: server/plts
          key: plt-${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}-deps-${{ hashFiles('server/mix.lock') }}

      - run: mix deps.get

      - run: mix check

      - run: mix deps.audit
