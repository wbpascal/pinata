name: server

on:
  push:
    branches: [master]
    paths: ["server/**", "mise.toml", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "mise.toml", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
      # Same pins as mise.toml; the first step fails when they drift apart.
      OTP_VERSION: "29.1.2"
      ELIXIR_VERSION: "1.20.5"
    steps:
      - uses: actions/checkout@v4

      - name: Pins match mise.toml
        working-directory: .
        run: |
          grep -qx "erlang = \"$OTP_VERSION\"" mise.toml
          grep -qx "elixir = \"$ELIXIR_VERSION-otp-${OTP_VERSION%%.*}\"" mise.toml

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict

      - name: Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: server/plts
          key: plt-${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-${{ hashFiles('server/mix.lock') }}

      - run: mix deps.get

      - run: mix check

      - run: mix deps.audit
