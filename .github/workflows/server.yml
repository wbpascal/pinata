name: server

on:
  push:
    branches: [master]
    paths: ["server/**", "Files/Server/2016/9Data/**", "mise.toml", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "Files/Server/2016/9Data/**", "mise.toml", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7

      - name: Data set for the tests (Git LFS, 9Data only)
        working-directory: .
        run: git lfs ls-files -l -I "Files/Server/2016/9Data/**" | cut -d' ' -f1 | sort > .lfs-9data-ids

      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-9data-${{ hashFiles('.lfs-9data-ids') }}

      - working-directory: .
        run: git lfs pull -I "Files/Server/2016/9Data/**"

      - uses: jdx/mise-action@v5

      - name: Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: server/plts
          key: plt-${{ runner.os }}-mise-${{ hashFiles('mise.toml') }}-deps-${{ hashFiles('server/mix.lock') }}

      - run: mix deps.get

      - run: mix check

      - run: mix deps.audit

  test-postgres:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pinata_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pinata_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: 'true'
      - uses: jdx/mise-action@v5
      - run: mix deps.get
      - run: mix pinata.migrate
      - run: mix test --warnings-as-errors
